name: Gemini multimodal real V4.2

on:
  push:
    branches: [work/v4.2-visual-copilot]
    paths:
      - '.github/workflows/gemini-v42-test.yml'
      - 'scripts/visual-gemini-live.mjs'
      - 'scripts/commercial-gemini-live.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    if: github.ref == 'refs/heads/work/v4.2-visual-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: gemini-v42-tests
      deployment: false
    steps:
      - name: Verificar presença do segredo dedicado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_V42_TEST_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Cadastre GEMINI_V42_TEST_API_KEY em Settings > Environments > gemini-v42-tests > Environment secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Executar cenários fictícios com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_V42_TEST_API_KEY }}
        run: node scripts/visual-gemini-live.mjs
      - name: Avaliar inteligência comercial com conversas fictícias
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_V42_TEST_API_KEY }}
        run: node scripts/commercial-gemini-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-v42-evidencias-ficticias
          path: test-results/gemini-v42-live/
          if-no-files-found: ignore
          retention-days: 14
