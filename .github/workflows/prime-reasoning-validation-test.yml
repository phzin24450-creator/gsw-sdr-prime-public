name: PRIME bounded reasoning real commercial acceptance
on:
  push:
    branches: [work/v4.2-visual-copilot]
    paths: ['.github/workflows/prime-reasoning-validation-test.yml']
permissions:
  contents: read
jobs:
  synthetic-commercial:
    if: github.ref == 'refs/heads/work/v4.2-visual-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: gemini-v42-tests
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06bc2150c4dbde0beb1d25574e2554891fa884ae
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run approved fictional cases with bounded request budget
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_V42_TEST_API_KEY }}
          PRIME_ROUND2_REAL_AUTHORIZED: 'yes'
          PRIME_LIVE_MAX_CALLS: '15'
        run: node scripts/prime-round2-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-reasoning-validation-fictional-evidence
          path: test-results/prime-round2/
          retention-days: 14
